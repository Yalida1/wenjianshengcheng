name: project-document-chain

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  APP_SECRET_KEY: ${APP_SECRET_KEY:-development-only-secret-change-before-production-123456}
  DATABASE_URL: postgresql+psycopg://docchain:${POSTGRES_PASSWORD:-docchain}@postgres:5432/docchain
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-docchain}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
  S3_BUCKET: project-documents
  STORAGE_BACKEND: s3
  LLM_PROVIDER: ${LLM_PROVIDER:-demo}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
  GENERATION_SOFT_TIME_LIMIT_SECONDS: ${GENERATION_SOFT_TIME_LIMIT_SECONDS:-7200}
  GENERATION_TIME_LIMIT_SECONDS: ${GENERATION_TIME_LIMIT_SECONDS:-7260}
  PROCUREMENT_PLANNING_ENABLED: ${PROCUREMENT_PLANNING_ENABLED:-true}
  PROCUREMENT_ANALYSIS_CHUNK_CHARS: ${PROCUREMENT_ANALYSIS_CHUNK_CHARS:-24000}
  PROCUREMENT_ANALYSIS_MAX_PARALLEL_CHUNKS: ${PROCUREMENT_ANALYSIS_MAX_PARALLEL_CHUNKS:-3}
  PROCUREMENT_ANALYSIS_SOFT_TIME_LIMIT_SECONDS: ${PROCUREMENT_ANALYSIS_SOFT_TIME_LIMIT_SECONDS:-1800}
  PROCUREMENT_ANALYSIS_TIME_LIMIT_SECONDS: ${PROCUREMENT_ANALYSIS_TIME_LIMIT_SECONDS:-1860}
  PROCUREMENT_ANALYSIS_STALE_AFTER_SECONDS: ${PROCUREMENT_ANALYSIS_STALE_AFTER_SECONDS:-300}
  PROCUREMENT_ANALYSIS_RECOVERY_INTERVAL_SECONDS: ${PROCUREMENT_ANALYSIS_RECOVERY_INTERVAL_SECONDS:-60}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  DEMO_ADMIN_ACCOUNT: ${DEMO_ADMIN_ACCOUNT:-admin}
  DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin123}

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: docchain
      POSTGRES_USER: docchain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docchain}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docchain -d docchain"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docchain}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/project-documents &&
        mc anonymous set none local/project-documents
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docchain}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      <<: *app-environment
      SERVICE_ROLE: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      <<: *app-environment
      SERVICE_ROLE: worker
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.app.worker.celery_app inspect ping -d celery@$${HOSTNAME} --timeout=5"]
      interval: 15s
      timeout: 8s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  verify:
    profiles: ["verify"]
    build:
      context: .
      dockerfile: Dockerfile.verify
    environment:
      E2E_BASE_URL: http://web:8080
      CI: "true"
    depends_on:
      web:
        condition: service_healthy
      worker:
        condition: service_healthy
    volumes:
      - ./artifacts:/workspace/artifacts
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
