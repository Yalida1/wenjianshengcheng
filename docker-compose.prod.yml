services:
  api:
    environment:
      APP_ENV: production
      SESSION_COOKIE_SECURE: "true"
    ports: []
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  worker:
    environment:
      APP_ENV: production
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G

  web:
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
