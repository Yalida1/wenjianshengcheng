[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "project-document-chain"
version = "0.1.0"
description = "项目文件链式生成平台后端"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "docxtpl>=0.20,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=6,<7",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<6",
  "reportlab>=4.2,<5",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.9,<1",
  "types-redis>=4.6,<5"
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q --strict-markers --disable-warnings"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
exclude = ["backend/migrations"]
ignore_missing_imports = true
disallow_untyped_decorators = false
